name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pytest torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      # Runs every level. Red is expected until you finish them all;
      # the job summary shows how many tests pass, so you can watch it climb.
      - run: pytest -q --tb=no -rN | tee summary.txt
      - if: always()
        run: echo "### $(tail -1 summary.txt)" >> "$GITHUB_STEP_SUMMARY"
